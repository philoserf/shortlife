name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Floats at latest to match the unversioned Brewfile, so CI and `task fmt`
      # cannot drift apart. Cost: a prettier release that changes formatting turns
      # this red on an untouched repo. Recover with `task update && task fmt`.
      - run: npx --yes prettier@latest --ignore-unknown --check .
