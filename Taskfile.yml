version: "3"

tasks:
  default:
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install the toolchain (Brewfile)
    cmds:
      - brew bundle --file=Brewfile

  update:
    desc: Upgrade the Brewfile toolchain to current versions
    cmds:
      - brew upgrade prettier go-task bun
      - prettier --version
      - task --version
      - bun --version

  fmt:
    desc: Format with prettier
    cmds:
      - prettier --ignore-unknown --write .

  check:
    desc: Verify formatting without writing
    cmds:
      - prettier --ignore-unknown --check .

  serve:
    desc: Serve public/ locally at http://localhost:8000, as the Worker does
    cmds:
      - bunx wrangler dev --port 8000

  deploy:
    desc: Check formatting, then deploy to Cloudflare
    cmds:
      - task: check
      - |
        if token=$(security find-generic-password -s cloudflare-api-token -w 2>/dev/null); then
          export CLOUDFLARE_API_TOKEN="$token"
        fi
        bunx wrangler deploy
